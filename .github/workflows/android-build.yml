name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests and build APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare Release APKs
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/batterify-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-assets/batterify-debug.apk \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batterify-apks
          path: release-assets/*.apk

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Batterify ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
